openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: deliveries
    description: Delivery operations
  - name: dashboard
    description: Operational dashboard
  - name: directory
    description: Stores and couriers
  - name: access
    description: Account access and role management
  - name: courier
    description: Courier-specific operations
  - name: routes
    description: Grouped courier routes and optimized stops
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get delivery operations summary
      responses:
        "200":
          description: Current operational indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /deliveries:
    get:
      operationId: listDeliveries
      tags: [deliveries]
      summary: List and filter deliveries
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: storeId
          schema:
            type: string
      responses:
        "200":
          description: Matching deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
    post:
      operationId: createDelivery
      tags: [deliveries]
      summary: Create a delivery request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryInput"
      responses:
        "201":
          description: Delivery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
  /deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      tags: [deliveries]
      summary: Get a delivery and its event history
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Delivery not found
    delete:
      operationId: deleteDelivery
      tags: [deliveries]
      summary: Delete an inactive delivery record
      description: Administrators may remove selected test records. Deliveries in active progress or accepted routes cannot be deleted.
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Delivery and its event history deleted
        "404":
          description: Delivery not found
        "409":
          description: Delivery is active or belongs to a locked route
  /deliveries/{deliveryId}/dispatch:
    post:
      operationId: dispatchDelivery
      tags: [deliveries]
      summary: Offer a delivery to an eligible courier
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchInput"
      responses:
        "200":
          description: Delivery offer dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
  /deliveries/{deliveryId}/status:
    patch:
      operationId: updateDeliveryStatus
      tags: [deliveries]
      summary: Update a delivery status
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryStatusInput"
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
  /stores:
    get:
      operationId: listStores
      tags: [directory]
      summary: List stores available to the central team
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
  /couriers:
    get:
      operationId: listCouriers
      tags: [directory]
      summary: List couriers and current availability
      responses:
        "200":
          description: Couriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Courier"
  /me:
    get:
      operationId: getMyProfile
      tags: [access]
      summary: Get the signed-in user's application profile
      responses:
        "200":
          description: Current account profile and access role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          description: Authentication required
  /access/users:
    get:
      operationId: listAccessUsers
      tags: [access]
      summary: List accounts and their application roles
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
  /access/users/{userId}:
    patch:
      operationId: updateAccessUser
      tags: [access]
      summary: Update an account role and scope
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
    delete:
      operationId: deleteAccessUser
      tags: [access]
      summary: Delete an application account and its Clerk login
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Account and linked login deleted; delivery history is preserved
        "400":
          description: Cannot delete the current administrator
        "404":
          description: Account not found
        "409":
          description: Last administrator or account has active courier work
        "502":
          description: App access was revoked but the Clerk login could not be deleted
  /courier/earnings:
    get:
      operationId: getCourierEarnings
      tags: [courier]
      summary: Get completed deliveries and payable total for a period
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [day, week, month]
      responses:
        "200":
          description: Completed delivery count and amount to receive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierEarnings"
  /delivery-routes:
    post:
      operationId: createDeliveryRoute
      tags: [routes]
      summary: Group requested deliveries into a courier route offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryRouteInput"
      responses:
        "201":
          description: Route offered to available couriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryRoute"
  /courier/routes:
    get:
      operationId: listCourierRoutes
      tags: [routes]
      summary: List route offers and the signed-in courier's active route
      responses:
        "200":
          description: Available route offers and assigned routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourierDeliveryRoute"
  /courier/location:
    post:
      operationId: updateCourierLocation
      tags: [courier]
      summary: Update the signed-in courier's current location during active work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierLocationInput"
      responses:
        "200":
          description: Current courier location saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierLocation"
  /courier/deliveries/{deliveryId}/navigation:
    get:
      operationId: getCourierDeliveryNavigation
      tags: [courier]
      summary: Get the signed-in courier's live route for an individual delivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Route from the courier's latest GPS position to the next destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryNavigation"
        "403":
          description: Delivery is not assigned to the signed-in courier
        "409":
          description: Active GPS position is unavailable or stale
        "422":
          description: Destination could not be geocoded
        "502":
          description: External routing service failed
        "503":
          description: Geoapify is not configured
  /courier/routes/{routeId}/accept:
    post:
      operationId: acceptCourierRoute
      tags: [routes]
      summary: Accept and optimize a grouped delivery route
      parameters:
        - in: path
          name: routeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCourierRouteInput"
      responses:
        "200":
          description: Route optimized and locked to the courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryRoute"
  /courier/routes/{routeId}/stops/{stopId}/complete:
    post:
      operationId: completeCourierRouteStop
      tags: [routes]
      summary: Complete the next stop on a locked route
      parameters:
        - in: path
          name: routeId
          required: true
          schema:
            type: string
        - in: path
          name: stopId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stop completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryRoute"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Delivery:
      type: object
      required: [id, code, customerName, destination, storeId, storeName, status, priority, deliveryAmount, createdAt, events]
      properties:
        id: { type: string }
        code: { type: string }
        customerName: { type: string }
        customerPhone: { type: ["string", "null"] }
        destination: { type: string }
        orderNumber: { type: string }
        notes: { type: ["string", "null"] }
        storeId: { type: string }
        storeName: { type: string }
        courierId: { type: ["string", "null"] }
        courierName: { type: ["string", "null"] }
        courierInitials: { type: ["string", "null"] }
        status: { type: string }
        priority: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastLocationAt: { type: ["string", "null"], format: date-time }
        estimatedMinutes: { type: ["integer", "null"] }
        distanceKm: { type: ["number", "null"] }
        deliveryAmount: { type: number, minimum: 0 }
        events:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryEvent"
    DeliveryEvent:
      type: object
      required: [id, label, timestamp, kind]
      properties:
        id: { type: string }
        label: { type: string }
        timestamp: { type: string, format: date-time }
        kind: { type: string }
        actor: { type: ["string", "null"] }
    DeliveryInput:
      type: object
      required: [customerName, destination, orderNumber, storeId, priority, deliveryAmount]
      properties:
        customerName: { type: string, minLength: 2 }
        customerPhone: { type: string }
        destination: { type: string, minLength: 5 }
        orderNumber: { type: string, minLength: 1 }
        notes: { type: string }
        storeId: { type: string }
        priority: { type: string, enum: [normal, urgent] }
        deliveryAmount: { type: number, exclusiveMinimum: 0 }
    DispatchInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [single, group] }
        courierId: { type: string }
    DeliveryStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED, TO_STORE, AT_STORE, IN_TRANSIT, COMPLETED, CANCELLED]
        note: { type: string }
    Store:
      type: object
      required: [id, name, code, city, address, active]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        city: { type: string }
        address: { type: string }
        active: { type: boolean }
    Courier:
      type: object
      required: [id, name, initials, status, currentLatitude, currentLongitude, lastLocationAt]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        status: { type: string, enum: [AVAILABLE, BUSY, OFFLINE] }
        currentDeliveryCode: { type: ["string", "null"] }
        currentLatitude: { type: ["number", "null"] }
        currentLongitude: { type: ["number", "null"] }
        lastLocationAt: { type: ["string", "null"], format: date-time }
    DashboardSummary:
      type: object
      required: [requested, awaitingCourier, offered, accepted, inTransit, completed, delayed, cancelled, availableCouriers, busyCouriers, averageAcceptanceMinutes, averageTotalMinutes]
      properties:
        requested: { type: integer }
        awaitingCourier: { type: integer }
        offered: { type: integer }
        accepted: { type: integer }
        inTransit: { type: integer }
        completed: { type: integer }
        delayed: { type: integer }
        cancelled: { type: integer }
        availableCouriers: { type: integer }
        busyCouriers: { type: integer }
        averageAcceptanceMinutes: { type: number }
        averageTotalMinutes: { type: number }
    AppUser:
      type: object
      required: [id, clerkUserId, email, name, role, storeId, courierId]
      properties:
        id: { type: string }
        clerkUserId: { type: ["string", "null"] }
        email: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [ADMIN, CENTRAL, STORE_MANAGER, STORE_STAFF, COURIER, PENDING]
        storeId: { type: ["string", "null"] }
        courierId: { type: ["string", "null"] }
    UserRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, CENTRAL, STORE_MANAGER, STORE_STAFF, COURIER, PENDING]
        storeId: { type: ["string", "null"] }
        courierId: { type: ["string", "null"] }
    CourierEarnings:
      type: object
      required: [period, completedDeliveries, amountToReceive]
      properties:
        period: { type: string, enum: [day, week, month] }
        completedDeliveries: { type: integer }
        amountToReceive: { type: number }
    CreateDeliveryRouteInput:
      type: object
      required: [deliveryIds]
      properties:
        deliveryIds:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items: { type: string }
    AcceptCourierRouteInput:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CourierLocationInput:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CourierLocation:
      type: object
      required: [latitude, longitude, lastLocationAt]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        lastLocationAt: { type: string, format: date-time }
    RouteCoordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CourierDeliveryNavigation:
      type: object
      required: [currentPosition, targetPosition, targetLabel, targetAddress, distanceMeters, durationSeconds, routeGeometry, lastLocationAt]
      properties:
        currentPosition:
          $ref: "#/components/schemas/RouteCoordinate"
        targetPosition:
          $ref: "#/components/schemas/RouteCoordinate"
        targetLabel: { type: string }
        targetAddress: { type: string }
        distanceMeters: { type: ["integer", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        routeGeometry:
          type: array
          items:
            $ref: "#/components/schemas/RouteCoordinate"
        lastLocationAt: { type: string, format: date-time }
    RouteDeliverySummary:
      type: object
      required: [id, code, customerName, destination, storeName, deliveryAmount, status]
      properties:
        id: { type: string }
        code: { type: string }
        customerName: { type: string }
        destination: { type: string }
        storeName: { type: string }
        deliveryAmount: { type: number }
        status: { type: string }
    DeliveryRouteStop:
      type: object
      required: [id, sequence, deliveryId, kind, address, latitude, longitude, status, code, customerName, storeName, deliveryAmount]
      properties:
        id: { type: string }
        sequence: { type: integer }
        deliveryId: { type: string }
        kind: { type: string, enum: [pickup, delivery] }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string, enum: [PENDING, DONE] }
        code: { type: string }
        customerName: { type: string }
        storeName: { type: string }
        deliveryAmount: { type: number }
    CourierDeliveryRoute:
      type: object
      required: [id, status, courierId, deliveryCount, amountToReceive, distanceKm, estimatedMinutes, lockedAt, deliveries, stops, routeGeometry]
      properties:
        id: { type: string }
        status: { type: string, enum: [OFFERED, ACCEPTED, COMPLETED] }
        courierId: { type: ["string", "null"] }
        deliveryCount: { type: integer }
        amountToReceive: { type: number }
        distanceKm: { type: ["number", "null"] }
        estimatedMinutes: { type: ["integer", "null"] }
        lockedAt: { type: ["string", "null"], format: date-time }
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/RouteDeliverySummary"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryRouteStop"
        routeGeometry:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/RouteCoordinate"

