openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: deliveries
    description: Delivery operations
  - name: dashboard
    description: Operational dashboard
  - name: directory
    description: Stores and couriers
  - name: access
    description: Account access and role management
  - name: courier
    description: Courier-specific operations
  - name: routes
    description: Grouped courier routes and optimized stops
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get delivery operations summary
      responses:
        "200":
          description: Current operational indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /operations/active-routes:
    get:
      operationId: listActiveRoutes
      tags: [routes]
      summary: List active route geometry for operations maps
      responses:
        "200":
          description: Accepted routes with assigned courier names and route geometry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveOperationsRoute"
  /reports/analytics:
    get:
      operationId: getDeliveryAnalytics
      tags: [dashboard]
      summary: Get filtered delivery analytics and report rows
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: storeId
          schema: { type: string }
        - in: query
          name: courierId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Filtered metrics, daily totals, courier totals and report rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAnalytics"
  /push/config:
    get:
      operationId: getPushConfig
      tags: [courier]
      summary: Get web push setup status and the public VAPID key
      responses:
        "200":
          description: Push permission and subscription configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfig"
  /push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [courier]
      summary: Get the normalized public VAPID key
      responses:
        "200":
          description: Normalized VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKeyResponse"
        "503":
          description: VAPID configuration is missing or invalid
  /push/subscription:
    post:
      operationId: savePushSubscription
      tags: [courier]
      summary: Save the signed-in courier's web push subscription
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "204":
          description: Subscription saved
    delete:
      operationId: removePushSubscription
      tags: [courier]
      summary: Remove the signed-in courier's web push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "204":
          description: Subscription removed
  /deliveries:
    get:
      operationId: listDeliveries
      tags: [deliveries]
      summary: List and filter deliveries
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: storeId
          schema:
            type: string
      responses:
        "200":
          description: Matching deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
    post:
      operationId: createDelivery
      tags: [deliveries]
      summary: Create a delivery request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryInput"
      responses:
        "201":
          description: Delivery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
  /deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      tags: [deliveries]
      summary: Get a delivery and its event history
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Delivery not found
    delete:
      operationId: deleteDelivery
      tags: [deliveries]
      summary: Permanently delete a delivery and its related data
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Delivery and related data permanently deleted
        "403":
          description: Only administrators may permanently delete deliveries
        "404":
          description: Delivery not found
        "409":
          description: Delivery belongs to an active grouped route
  /deliveries/{deliveryId}/dispatch:
    post:
      operationId: dispatchDelivery
      tags: [deliveries]
      summary: Offer a delivery to an eligible courier
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchInput"
      responses:
        "200":
          description: Delivery offer dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
  /deliveries/{deliveryId}/status:
    patch:
      operationId: updateDeliveryStatus
      tags: [deliveries]
      summary: Update a delivery status
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryStatusInput"
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
  /deliveries/{deliveryId}/evidence/upload-url:
    post:
      operationId: requestDeliveryEvidenceUploadUrl
      tags: [deliveries]
      summary: Request a private upload URL for delivery proof
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryEvidenceUploadInput"
      responses:
        "200":
          description: Private upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryEvidenceUploadUrl"
  /deliveries/{deliveryId}/evidence:
    get:
      operationId: getDeliveryEvidence
      tags: [deliveries]
      summary: Open a delivery's private proof photo
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private image stream for authorized delivery users
        "404":
          description: No proof photo is available
  /stores:
    get:
      operationId: listStores
      tags: [directory]
      summary: List stores available to the central team
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [directory]
      summary: Create a store branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Store branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
  /stores/{storeId}:
    put:
      operationId: updateStore
      tags: [directory]
      summary: Update a store branch
      parameters:
        - in: path
          name: storeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "200":
          description: Store branch updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "404":
          description: Store branch not found
    delete:
      operationId: deleteStore
      tags: [directory]
      summary: Delete a store without linked deliveries or accounts
      parameters:
        - in: path
          name: storeId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Store branch deleted
        "404":
          description: Store branch not found
        "409":
          description: Store branch has linked deliveries or accounts
  /enderecos/autocomplete:
    get:
      operationId: autocompleteAddresses
      tags: [directory]
      summary: Search Brazilian addresses through Mapbox
      parameters:
        - in: query
          name: texto
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        "200":
          description: Address suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressSuggestion"
        "422":
          description: Search text is invalid
        "502":
          description: Geocoding provider could not complete the request
        "503":
          description: Geocoding is not configured
  /admin/demo-data/cleanup:
    post:
      operationId: cleanupDemoData
      tags: [access]
      summary: Remove known demo records without changing user accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoDataCleanupInput"
      responses:
        "200":
          description: Demo data cleanup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataCleanupSummary"
        "403":
          description: Administrator role required
  /couriers:
    get:
      operationId: listCouriers
      tags: [directory]
      summary: List couriers and current availability
      parameters:
        - in: query
          name: includeUnlinked
          required: false
          schema:
            type: boolean
          description: Include courier profiles without a linked courier account. Administrator-only.
      responses:
        "200":
          description: Couriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Courier"
  /me:
    get:
      operationId: getMyProfile
      tags: [access]
      summary: Get the signed-in user's application profile
      responses:
        "200":
          description: Current account profile and access role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          description: Authentication required
  /access/users:
    get:
      operationId: listAccessUsers
      tags: [access]
      summary: List accounts and their application roles
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
  /access/users/{userId}:
    patch:
      operationId: updateAccessUser
      tags: [access]
      summary: Update an account role and scope
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
    delete:
      operationId: deleteAccessUser
      tags: [access]
      summary: Delete an application account and its Clerk login
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Account and linked login deleted; delivery history is preserved
        "400":
          description: Cannot delete the current administrator
        "404":
          description: Account not found
        "409":
          description: Last administrator or account has active courier work
        "502":
          description: App access was revoked but the Clerk login could not be deleted
  /courier/earnings:
    get:
      operationId: getCourierEarnings
      tags: [courier]
      summary: Get completed deliveries and payable total for a period
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [day, week, month]
      responses:
        "200":
          description: Completed delivery count and amount to receive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierEarnings"
  /delivery-routes:
    post:
      operationId: createDeliveryRoute
      tags: [routes]
      summary: Group requested deliveries into a courier route offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryRouteInput"
      responses:
        "201":
          description: Route offered to available couriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryRoute"
  /courier/routes:
    get:
      operationId: listCourierRoutes
      tags: [routes]
      summary: List route offers and the signed-in courier's active route
      responses:
        "200":
          description: Available route offers and assigned routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourierDeliveryRoute"
  /courier/location:
    post:
      operationId: updateCourierLocation
      tags: [courier]
      summary: Update the signed-in courier's current location while the PWA is open
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierLocationInput"
      responses:
        "200":
          description: Current courier location saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierLocation"
  /courier/deliveries/{deliveryId}/navigation:
    get:
      operationId: getCourierDeliveryNavigation
      tags: [courier]
      summary: Get the signed-in courier's live route for an individual delivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Route from the courier's latest GPS position to the next destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryNavigation"
        "403":
          description: Delivery is not assigned to the signed-in courier
        "409":
          description: Active GPS position is unavailable or stale
        "422":
          description: Destination could not be geocoded
        "502":
          description: External routing service failed
        "503":
          description: Mapbox geocoding is not configured
  /courier/routes/{routeId}/accept:
    post:
      operationId: acceptCourierRoute
      tags: [routes]
      summary: Accept and optimize a grouped delivery route
      parameters:
        - in: path
          name: routeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCourierRouteInput"
      responses:
        "200":
          description: Route optimized and locked to the courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryRoute"
  /courier/routes/{routeId}/stops/{stopId}/complete:
    post:
      operationId: completeCourierRouteStop
      tags: [routes]
      summary: Complete the next stop on a locked route
      parameters:
        - in: path
          name: routeId
          required: true
          schema:
            type: string
        - in: path
          name: stopId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCourierRouteStopInput"
      responses:
        "200":
          description: Stop completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryRoute"
  /courier/routes/{routeId}/stops/{stopId}/arrive:
    post:
      operationId: recordCourierStopArrival
      tags: [routes]
      summary: Record the courier's arrival at a store route stop
      parameters:
        - in: path
          name: routeId
          required: true
          schema: { type: string }
        - in: path
          name: stopId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Arrival time recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierDeliveryRoute"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Delivery:
      type: object
      required: [id, code, customerName, destination, storeId, storeName, status, priority, deliveryAmount, createdAt, events, customerLatitude, customerLongitude, evidenceAvailable]
      properties:
        id: { type: string }
        code: { type: string }
        customerName: { type: string }
        customerPhone: { type: ["string", "null"] }
        destination: { type: string }
        orderNumber: { type: string }
        notes: { type: ["string", "null"] }
        storeId: { type: string }
        storeName: { type: string }
        courierId: { type: ["string", "null"] }
        courierName: { type: ["string", "null"] }
        courierInitials: { type: ["string", "null"] }
        status: { type: string }
        priority: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastLocationAt: { type: ["string", "null"], format: date-time }
        customerLatitude: { type: ["number", "null"] }
        customerLongitude: { type: ["number", "null"] }
        estimatedMinutes: { type: ["integer", "null"] }
        distanceKm: { type: ["number", "null"] }
        deliveryAmount: { type: number, minimum: 0 }
        evidenceAvailable: { type: boolean }
        events:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryEvent"
    DeliveryEvent:
      type: object
      required: [id, label, timestamp, kind]
      properties:
        id: { type: string }
        label: { type: string }
        timestamp: { type: string, format: date-time }
        kind: { type: string }
        actor: { type: ["string", "null"] }
    DeliveryInput:
      type: object
      required: [customerName, destination, orderNumber, storeId, priority]
      properties:
        customerName: { type: string, minLength: 2 }
        customerPhone: { type: string }
        destination: { type: string, minLength: 5 }
        customerLatitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        customerLongitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        orderNumber: { type: string, minLength: 1 }
        notes: { type: string }
        storeId: { type: string }
        priority: { type: string, enum: [normal, urgent] }
        deliveryAmount: { type: number, minimum: 0, description: Deprecated; server uses the selected branch's configured fee }
    DispatchInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [single, group] }
        courierId: { type: string }
    DeliveryStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED, TO_STORE, AT_STORE, IN_TRANSIT, COMPLETED, CANCELLED]
        note: { type: string, maxLength: 500 }
        evidencePath: { type: string }
    Store:
      type: object
      required: [id, name, code, city, address, active, street, number, complement, neighborhood, stateCode, postalCode, phone, managerName, managerPhone, assistantManagerName, assistantManagerPhone, latitude, longitude, deliveryCount, deliveryFee]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        city: { type: string }
        address: { type: string }
        active: { type: boolean }
        street: { type: ["string", "null"] }
        number: { type: ["string", "null"] }
        complement: { type: ["string", "null"] }
        neighborhood: { type: ["string", "null"] }
        stateCode: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        managerName: { type: ["string", "null"] }
        managerPhone: { type: ["string", "null"] }
        assistantManagerName: { type: ["string", "null"] }
        assistantManagerPhone: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        deliveryCount: { type: integer, minimum: 0 }
        deliveryFee: { type: number, minimum: 0 }
    StoreInput:
      type: object
      required: [name, address, street, number, city, stateCode, managerName, latitude, longitude, deliveryFee]
      properties:
        name: { type: string, minLength: 2 }
        address: { type: string, minLength: 5 }
        street: { type: string, minLength: 1 }
        number: { type: string, minLength: 1 }
        complement: { type: string }
        neighborhood: { type: string }
        city: { type: string, minLength: 2 }
        stateCode: { type: string, minLength: 2, maxLength: 2 }
        postalCode: { type: string }
        phone: { type: string }
        managerName: { type: string, minLength: 2 }
        managerPhone: { type: string }
        assistantManagerName: { type: string }
        assistantManagerPhone: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        deliveryFee: { type: number, minimum: 0 }
    PushConfig:
      type: object
      required: [enabled, publicKey]
      properties:
        enabled: { type: boolean }
        publicKey: { type: ["string", "null"] }
    VapidPublicKeyResponse:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string, minLength: 87, maxLength: 87, pattern: "^B[A-Za-z0-9_-]{86}$" }
    PushSubscriptionInput:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint: { type: string, format: uri, minLength: 10 }
        p256dh: { type: string, minLength: 16 }
        auth: { type: string, minLength: 8 }
    DeliveryEvidenceUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 8388608 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    DeliveryEvidenceUploadUrl:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    CompleteCourierRouteStopInput:
      type: object
      properties:
        evidencePath: { type: string }
    ActiveOperationsRoute:
      type: object
      required: [id, courierId, courierFirstName, routeGeometry]
      properties:
        id: { type: string }
        courierId: { type: string }
        courierFirstName: { type: string }
        routeGeometry:
          type: array
          items:
            $ref: "#/components/schemas/RouteCoordinate"
    DeliveryAnalytics:
      type: object
      required: [summary, daily, couriers, deliveries]
      properties:
        summary:
          $ref: "#/components/schemas/DeliveryAnalyticsSummary"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAnalyticsDay"
        couriers:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAnalyticsCourier"
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAnalyticsRow"
    DeliveryAnalyticsSummary:
      type: object
      required: [total, completed, cancelled, averageTotalMinutes, averageStoreMinutes, averageDeliveryMinutes, courierAmount]
      properties:
        total: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        averageTotalMinutes: { type: number }
        averageStoreMinutes: { type: number }
        averageDeliveryMinutes: { type: number }
        courierAmount: { type: number }
    DeliveryAnalyticsDay:
      type: object
      required: [date, created, completed]
      properties:
        date: { type: string, format: date }
        created: { type: integer }
        completed: { type: integer }
    DeliveryAnalyticsCourier:
      type: object
      required: [courierId, courierName, completedDeliveries, courierAmount, averageTotalMinutes]
      properties:
        courierId: { type: string }
        courierName: { type: string }
        completedDeliveries: { type: integer }
        courierAmount: { type: number }
        averageTotalMinutes: { type: number }
    DeliveryAnalyticsRow:
      type: object
      required: [id, code, customerName, destination, storeName, courierName, status, deliveryAmount, createdAt, storeArrivedAt, storeDepartedAt, completedAt, evidenceAvailable]
      properties:
        id: { type: string }
        code: { type: string }
        customerName: { type: string }
        destination: { type: string }
        storeName: { type: string }
        courierName: { type: ["string", "null"] }
        status: { type: string }
        deliveryAmount: { type: number }
        createdAt: { type: string, format: date-time }
        storeArrivedAt: { type: ["string", "null"], format: date-time }
        storeDepartedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        evidenceAvailable: { type: boolean }
    AddressSuggestion:
      type: object
      required: [formatted, street, houseNumber, suburb, district, city, stateCode, postcode, latitude, longitude]
      properties:
        formatted: { type: string }
        street: { type: ["string", "null"] }
        houseNumber: { type: ["string", "null"] }
        suburb: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        stateCode: { type: ["string", "null"] }
        postcode: { type: ["string", "null"] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    DemoDataCleanupSummary:
      type: object
      required: [removedDeliveries, removedCouriers, removedStores, preservedDeliveries, preservedLinkedCouriers, preservedLinkedStores]
      properties:
        removedDeliveries: { type: integer, minimum: 0 }
        removedCouriers: { type: integer, minimum: 0 }
        removedStores: { type: integer, minimum: 0 }
        preservedDeliveries: { type: integer, minimum: 0 }
        preservedLinkedCouriers: { type: integer, minimum: 0 }
        preservedLinkedStores: { type: integer, minimum: 0 }
    DemoDataCleanupInput:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [REMOVE_DEMO_RECORDS]
    Courier:
      type: object
      required: [id, name, initials, status, currentLatitude, currentLongitude, currentAccuracyMeters, currentSpeedMetersPerSecond, locationMeasuredAt, lastLocationAt]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        status: { type: string, enum: [AVAILABLE, BUSY, OFFLINE] }
        currentDeliveryCode: { type: ["string", "null"] }
        currentLatitude: { type: ["number", "null"] }
        currentLongitude: { type: ["number", "null"] }
        currentAccuracyMeters: { type: ["number", "null"], minimum: 0 }
        currentSpeedMetersPerSecond: { type: ["number", "null"], minimum: 0 }
        locationMeasuredAt: { type: ["string", "null"], format: date-time }
        lastLocationAt: { type: ["string", "null"], format: date-time }
    DashboardSummary:
      type: object
      required: [requested, awaitingCourier, offered, accepted, inTransit, completed, delayed, cancelled, totalCouriers, availableCouriers, busyCouriers, offlineCouriers, averageAcceptanceMinutes, averageTotalMinutes]
      properties:
        requested: { type: integer }
        awaitingCourier: { type: integer }
        offered: { type: integer }
        accepted: { type: integer }
        inTransit: { type: integer }
        completed: { type: integer }
        delayed: { type: integer }
        cancelled: { type: integer }
        totalCouriers: { type: integer }
        availableCouriers: { type: integer }
        busyCouriers: { type: integer }
        offlineCouriers: { type: integer }
        averageAcceptanceMinutes: { type: ["number", "null"] }
        averageTotalMinutes: { type: ["number", "null"] }
    AppUser:
      type: object
      required: [id, clerkUserId, email, name, role, storeId, courierId]
      properties:
        id: { type: string }
        clerkUserId: { type: ["string", "null"] }
        email: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [ADMIN, CENTRAL, STORE_MANAGER, STORE_STAFF, COURIER, PENDING]
        storeId: { type: ["string", "null"] }
        courierId: { type: ["string", "null"] }
    UserRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, CENTRAL, STORE_MANAGER, STORE_STAFF, COURIER, PENDING]
        storeId: { type: ["string", "null"] }
        courierId: { type: ["string", "null"] }
    CourierEarnings:
      type: object
      required: [period, completedDeliveries, amountToReceive]
      properties:
        period: { type: string, enum: [day, week, month] }
        completedDeliveries: { type: integer }
        amountToReceive: { type: number }
    CreateDeliveryRouteInput:
      type: object
      required: [deliveryIds]
      properties:
        deliveryIds:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items: { type: string }
    AcceptCourierRouteInput:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CourierLocationInput:
      type: object
      required: [latitude, longitude, measuredAt]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: ["number", "null"], minimum: 0 }
        speedMetersPerSecond: { type: ["number", "null"], minimum: 0 }
        measuredAt: { type: string, format: date-time }
    CourierLocation:
      type: object
      required: [latitude, longitude, accuracyMeters, speedMetersPerSecond, measuredAt, lastLocationAt]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: ["number", "null"], minimum: 0 }
        speedMetersPerSecond: { type: ["number", "null"], minimum: 0 }
        measuredAt: { type: string, format: date-time }
        lastLocationAt: { type: string, format: date-time }
    RouteCoordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CourierDeliveryNavigation:
      type: object
      required: [currentPosition, targetPosition, targetLabel, targetAddress, distanceMeters, durationSeconds, routeGeometry, lastLocationAt]
      properties:
        currentPosition:
          $ref: "#/components/schemas/RouteCoordinate"
        targetPosition:
          $ref: "#/components/schemas/RouteCoordinate"
        targetLabel: { type: string }
        targetAddress: { type: string }
        distanceMeters: { type: ["integer", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        routeGeometry:
          type: array
          items:
            $ref: "#/components/schemas/RouteCoordinate"
        lastLocationAt: { type: string, format: date-time }
    RouteDeliverySummary:
      type: object
      required: [id, code, customerName, destination, storeName, deliveryAmount, status]
      properties:
        id: { type: string }
        code: { type: string }
        customerName: { type: string }
        destination: { type: string }
        storeName: { type: string }
        deliveryAmount: { type: number }
        status: { type: string }
    DeliveryRouteStop:
      type: object
      required: [id, sequence, deliveryId, kind, address, latitude, longitude, status, code, customerName, storeName, deliveryAmount]
      properties:
        id: { type: string }
        sequence: { type: integer }
        deliveryId: { type: string }
        kind: { type: string, enum: [pickup, delivery] }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string, enum: [PENDING, DONE] }
        code: { type: string }
        customerName: { type: string }
        storeName: { type: string }
        deliveryAmount: { type: number }
    CourierDeliveryRoute:
      type: object
      required: [id, status, courierId, deliveryCount, amountToReceive, distanceKm, estimatedMinutes, lockedAt, deliveries, stops, routeGeometry]
      properties:
        id: { type: string }
        status: { type: string, enum: [OFFERED, ACCEPTED, COMPLETED] }
        courierId: { type: ["string", "null"] }
        deliveryCount: { type: integer }
        amountToReceive: { type: number }
        distanceKm: { type: ["number", "null"] }
        estimatedMinutes: { type: ["integer", "null"] }
        lockedAt: { type: ["string", "null"], format: date-time }
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/RouteDeliverySummary"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryRouteStop"
        routeGeometry:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/RouteCoordinate"

