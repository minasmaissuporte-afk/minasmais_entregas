<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#E20210" />
    <title>Sem conexão · Minas Mais</title>
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f4f3f1;color:#24272d;font:16px system-ui,sans-serif}
      main{width:min(100%,28rem);padding:2rem;border:1px solid #e7e6e3;border-radius:1rem;background:#fff;text-align:center}
      h1{margin:0;font-size:1.4rem}
      p{margin:.75rem 0 0;color:#5f646b;line-height:1.55}
      button{margin-top:1.4rem;width:100%;min-height:48px;border:0;border-radius:12px;background:#E20210;color:#fff;font:700 16px system-ui,sans-serif}
      button:focus-visible{outline:3px solid #1f2329;outline-offset:3px}
      #status{font-size:14px}
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para entrar e carregar suas rotas e entregas. A página abre sozinha quando o sinal voltar.</p>
      <button type="button" id="retry">Tentar agora</button>
      <p id="status">Aguardando a conexão…</p>
    </main>
    <script>
      function retry() {
        document.getElementById("status").textContent = "Verificando conexão…";
        window.location.reload();
      }
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
      window.setInterval(function () { if (navigator.onLine) retry(); }, 10000);
    </script>
  </body>
</html>
